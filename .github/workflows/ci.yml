# Two checks whose result each pull request chooses: ci/required.txt and
# ci/optional.txt hold "pass", "fail" or "slow" (slow sleeps ten minutes, to
# keep a check pending). Branch protection decides which one is required.
name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  required-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          r=$(cat ci/required.txt 2>/dev/null || echo pass)
          [ "$r" = slow ] && sleep 600
          [ "$r" != fail ]
  optional-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          r=$(cat ci/optional.txt 2>/dev/null || echo pass)
          [ "$r" = slow ] && sleep 600
          [ "$r" != fail ]
